+;best=Math.max(best,i);save();$('question').textContent=q.good;$('portrait').style.transform='scale(1.035)';setTimeout(()=>{$('portrait').style.transform=''},300);$('fill').style.width=i+'%';$('choices').innerHTML=`<button class="primary" onclick="${i===100?'win()':'render()'}">${i===100?'💍 エンディングへ':'💖 正解！ 次の問題へ →'}</button>`}else{$('portrait').src=PORTRAITS[(mode==='boy'?6:0)+5];$('outfit').textContent='💀 闇落ち';$('portrait').classList.add('shake');card(`<div style="font-size:50px">💔</div><h1>GAME OVER</h1><p>${q.bad.replaceAll('私（俺）',mode==='boy'?'俺':'私')}</p><p>第${i+1}問で撃沈！<br>正解は<br><b>「${q.a[q.c]}」</b></p><p class="stats">最高到達：${best}問 ／ 挑戦：${attempts}回</p><button class="primary" onclick="retry()">💀 第1問からやり直す</button><button class="secondary" onclick="start()">モード選択へ</button>`)}}function retry(){i=0;attempts++;save();close();render()}function win(){card(`<div style="font-size:52px">💍🎉</div><h1>奇跡の100問突破！</h1><p>恋人「全部分かってくれたんだね♡」</p><p>……と思ったら<br><b>「じゃあ好きなところ100個言って♡」</b></p><p>🏆 伝説の恋愛耐久王！</p><p class="stats">挑戦回数：${attempts}回</p><button class="primary" onclick="start()">もう一度遊ぶ</button>`)}start();
